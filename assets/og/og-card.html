<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Social preview card</title>
    <!-- Source for assets/img/og-cover.png. Rendered at exactly 1200×630. -->
    <style>
      @font-face {
        font-family: "Instrument Serif";
        src: url("/assets/fonts/instrument-serif-400.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
      }
      @font-face {
        font-family: "Instrument Serif";
        src: url("/assets/fonts/instrument-serif-400i.woff2") format("woff2");
        font-weight: 400;
        font-style: italic;
      }
      @font-face {
        font-family: "IBM Plex Sans";
        src: url("/assets/fonts/plex-sans-var.woff2") format("woff2");
        font-weight: 400 600;
        font-style: normal;
      }
      @font-face {
        font-family: "IBM Plex Mono";
        src: url("/assets/fonts/plex-mono-400.woff2") format("woff2");
        font-weight: 400;
      }

      * { box-sizing: border-box; }

      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        background: #faf8f3;
        color: #1a1a17;
        font-family: "IBM Plex Sans", sans-serif;
        display: flex;
      }

      .edge {
        width: 14px;
        flex: none;
        background: #b23a0c;
      }

      .card {
        flex: 1;
        padding: 58px 72px 54px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
      }

      .top {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-family: "IBM Plex Mono", monospace;
        font-size: 15px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #6d6d5f;
      }

      .top .accent { color: #b23a0c; }

      h1 {
        margin: 6px 0 0;
        font-family: "Instrument Serif", serif;
        font-weight: 400;
        font-size: 104px;
        line-height: 0.93;
        letter-spacing: -0.025em;
      }

      h1 em {
        font-style: italic;
        color: #45453c;
      }

      .rule {
        height: 1px;
        background: #d9d3c3;
        margin: 30px 0 22px;
        width: 100%;
      }

      .statement {
        font-family: "Instrument Serif", serif;
        font-size: 34px;
        line-height: 1.32;
        letter-spacing: -0.01em;
        color: #45453c;
        max-width: 820px;
      }

      .bottom {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-family: "IBM Plex Mono", monospace;
        font-size: 15px;
        letter-spacing: 0.1em;
        color: #6d6d5f;
      }

      .chips {
        display: flex;
        gap: 10px;
      }

      .chip {
        border: 1px solid #d9d3c3;
        border-radius: 999px;
        padding: 6px 12px;
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #45453c;
      }
    </style>
  </head>
  <body>
    <div class="edge"></div>
    <div class="card">
      <div>
        <div class="top">
          <span>PNB <span class="accent">/</span> Portfolio</span>
          <span>2026</span>
        </div>

        <h1>Purvesh<br />Nilesh <em>Bhadale</em></h1>

        <div class="rule"></div>

        <p class="statement">
          I build AI tools that help students learn and decide — research, learning, and choosing
          universities.
        </p>
      </div>

      <div class="bottom">
        <div class="chips">
          <span class="chip">AI for learning</span>
          <span class="chip">Rust</span>
          <span class="chip">Quantum</span>
        </div>
        <span>purveshnileshbhadale.github.io</span>
      </div>
    </div>
  </body>
</html>
